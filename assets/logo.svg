<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="WeatherBench-MingYang-Tech logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="globe-clip">
      <circle cx="64" cy="60" r="32"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="5" y="5" width="118" height="118" rx="30" fill="url(#bg)"/>
  <rect x="5" y="5" width="118" height="56" rx="30" fill="url(#shine)"/>

  <!-- globe -->
  <circle cx="64" cy="60" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.6"/>
  <g clip-path="url(#globe-clip)" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.4">
    <ellipse cx="64" cy="60" rx="12" ry="32"/>
    <ellipse cx="64" cy="60" rx="32" ry="10"/>
    <ellipse cx="64" cy="47" rx="26" ry="7.5"/>
    <ellipse cx="64" cy="73" rx="26" ry="7.5"/>
  </g>

  <!-- leaderboard bars (ascending scores) -->
  <rect x="51" y="61" width="6" height="11" rx="1.8" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="61" y="55" width="6" height="17" rx="1.8" fill="#ffffff"/>
  <rect x="71" y="48" width="6" height="24" rx="1.8" fill="#fbbf24"/>

  <!-- verified / benchmarked badge -->
  <circle cx="96" cy="32" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M89.5 32 L94 36.5 L102.5 27.5" fill="none" stroke="#ffffff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
