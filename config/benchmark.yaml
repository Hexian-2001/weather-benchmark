# WeatherBench-MingYang-Tech — evaluation scope config.
# This file is the single definition of "one truth, one convention": every score takes a
# hash of this config; any config change produces a new evaluation row and never
# overwrites history (immutable archive).

benchmark:
  name: weather-benchmark
  version: "0.1.0"

# ---- Region (reuses the existing prediction_store China box) ----
region:
  name: china
  lat: [15.0, 55.0]
  lon: [70.0, 140.0]
  # Phase 3 sub-regions (meteorologically meaningful splits): East China / South China / Tibetan Plateau
  subregions: []

# ---- Spatial resolution ----
grid:
  common_deg: 0.25              # common comparison grid (denominator for both models)
  native_deg: [0.25, 0.1]       # native resolution classes
  regrid_method: conservative   # first-order conservative remapping (consistent with WeatherBench 2)

# ---- Years ----
years:
  test: [2023, 2024, 2025]      # evaluation years (locked). All models must be unseen on these
  climate: [1991, 2020]         # 30-yr climatology (ACC reference)

# ---- Time ----
time:
  init_times: ["00", "12"]      # initialization times (UTC, WB2 standard)
  horizons:
    step_6h: { horizon_h: 240, lead_step_h: 6 }   # primary: 6h models 0–240h (40 steps)
    step_1h: { horizon_h: 72, lead_step_h: 1 }    # downscaling track: 1h models 0–72h
  cross_model_lead_h: 6         # unified cross-model convention: multiples of 6h

# ---- Ground truth ----
truth:
  primary: ERA5                 # formal benchmark truth (locked)
  near_real_time: IFS_HRES      # near-real-time check channel (fc0 analysis)
  cache_grid_deg: 0.25          # truth regridded once and cached

# ---- Variables (reuses UNIFIED_MAP names) ----
variables:
  surface:
    - 2m_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - mean_sea_level_pressure
  pressure:
    - { name: geopotential, level: 500 }
    - { name: temperature, level: 850 }
    - { name: temperature, level: 500 }
    - { name: temperature, level: 250 }
    - { name: u_component_of_wind, level: 850 }
    - { name: v_component_of_wind, level: 850 }
    - { name: u_component_of_wind, level: 250 }
    - { name: v_component_of_wind, level: 250 }
    - { name: specific_humidity, level: 850 }

# ---- Metrics ----
metrics:
  primary: [RMSE, ACC]          # latitude-weighted; ACC vs the 30-yr climatology
  auxiliary: [MAE, bias]
  derived: [wind_vector_RMSE, skill_score]
  acc_skill_threshold: 0.6      # ACC < 0.6 = no synoptic skill (ECMWF convention)

# ---- Baselines (always run together, otherwise scores are meaningless) ----
baselines:
  - climatology
  - persistence
  - IFS_HRES
persistence_hours: 24

# ---- Runtime directories (Pawsey scratch; this repo holds only code/config/cards) ----
storage:
  root: /scratch/pawsey0115/hwang4/work_projects/weather-benchmark
  truth_dir: "{root}/data/truth"
  climatology_dir: "{root}/data/climatology"
  baselines_dir: "{root}/data/baselines"
  results_dir: "{root}/results"
  scores_dir: "{root}/scores"
