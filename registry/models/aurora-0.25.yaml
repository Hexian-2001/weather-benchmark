model_id: aurora-0.25
name: Aurora
family: aurora
variant: "0.25"
version: 1.0.0
status: registered

architecture:
  type: "3D Swin Transformer (perceiver-based foundation model)"
  parameters: 1300000000
  resolution_deg: 0.25
  time_step_h: 6
  horizon_h: 240
  variables:
    - 2m_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - mean_sea_level_pressure
    - geopotential
    - temperature
    - u_component_of_wind
    - v_component_of_wind
    - specific_humidity

training:
  origin: pretrained-as-is
  base_checkpoint: microsoft/aurora-0.25-pretrained
  base_checkpoint_hash: "sha256:TODO"   # fill in the real hash to enter the formal archive
  finetuning:
    enabled: false
  training_data:
    years: [1979, 2021]       # multi-source pretraining; latest cutoff ~2021 (still < 2023, compliant)
    source: "ERA5 + HRES + GFS + CMIP6 + MERRA2 (multi-source)"

data:
  init_source: "IFS HRES fc0 (open data)"
  input_variables:
    - 2m_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - mean_sea_level_pressure
    - geopotential
    - temperature
    - u_component_of_wind
    - v_component_of_wind
    - specific_humidity

