model_id: graphcast-operational
name: GraphCast
family: graphcast
variant: operational
version: 1.0.0
status: registered

architecture:
  type: "Graph neural network (encode–process–decode on icosahedral mesh)"
  parameters: 36700000        # 约 37M，TODO 以官方口径确认
  resolution_deg: 0.25
  time_step_h: 6
  horizon_h: 240
  variables:
    - 2m_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - mean_sea_level_pressure
    - geopotential
    - temperature
    - u_component_of_wind
    - v_component_of_wind
    - specific_humidity

training:
  origin: pretrained-as-is
  base_checkpoint: deepmind/graphcast
  base_checkpoint_hash: "sha256:TODO"   # 补实际哈希以进正式存档
  finetuning:
    enabled: false
  training_data:
    years: [1979, 2017]
    source: ERA5

data:
  init_source: "IFS HRES fc0 (open data)"
  input_variables:
    - 2m_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - mean_sea_level_pressure
    - geopotential
    - temperature
    - u_component_of_wind
    - v_component_of_wind
    - specific_humidity

attestation:
  declaration: "模型及其基础 checkpoint 未使用 2023–2025 任何数据训练/微调"
  training_end_year: 2017
  finetune_end_year: 2017
  signed_by: "TODO"
  date: "2026-09-20"

owner: "算法团队"
contact: ""

reproducibility:
  conda_env: "aurora-gpu (spec hash TODO)"
  code_ref: "TODO"
  seed: null
  hardware: "Setonix MI250X"
